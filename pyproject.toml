[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "holy-pokemon"
version = "0.2.0"
description = "Private source-grounded card research and manual arbitrage workspace"
requires-python = ">=3.12"
dependencies = ["Pillow>=11,<14", "certifi>=2025.1.31"]
[project.optional-dependencies]
inspection = ["numpy>=1.26,<3", "opencv-python-headless>=4.8,<5"]
vision = ["torch>=2.6,<3", "torchvision>=0.21,<1", "av>=15,<18"]
dev = ["ruff>=0.12", "pip-audit>=2.9"]
[project.scripts]
holy-pokemon = "holy_pokemon.cli:main"
[tool.setuptools.packages.find]
include = ["holy_pokemon*"]
[tool.setuptools.package-data]
holy_pokemon = ["web/*.html", "web/*.js", "web/*.css"]
[tool.ruff.lint]
select = ["F", "E9"]
